name: Test and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
        working-directory: native
      - run: dart format --output=none --set-exit-if-changed lib test test_browser
        working-directory: native
      - run: flutter analyze
        working-directory: native
      - run: flutter test
        working-directory: native
      - uses: actions/configure-pages@v5
        id: pages
      - run: flutter build web --no-web-resources-cdn --base-href "$PAGES_BASE_PATH/" --dart-define "WEB_GAME_URL=$PAGES_BASE_URL/"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        working-directory: native
      - run: flutter build web --no-web-resources-cdn --target test_browser/main.dart --output build/browser-test
        working-directory: native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: native/build/web
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
